name: Windows VST3 + Standalone
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Run engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows x64
        run: cmake --build build --config Release --target swarm_windows_package
      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: ANKS-Swarm-01-Windows-Release
          path: build/packages/Release/*.zip
          if-no-files-found: error
